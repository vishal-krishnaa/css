<!DOCTYPE html>
<html>

<head>
    <title>Restaurant Menu</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        h3{
            text-align:right;
            color:plum;
            font-family:sans-serif;
            font-size:30px;
        }

        p{
            text-align:center;
            text-transform:uppercase;
            letter-spacing:3px;
            word-spacing:6px;
        }

        table{
            width:60%;
            margin:auto;
            border-collapse:collapse;
        }

        table, th, td{
            border:2px solid black;
        }

        th, td{
            text-align:center;
            vertical-align:middle;
            padding:10px;
        }

        a{
            text-decoration:none;
            color:blue;
        }

        a:hover{
            color:red;
        }

    </style>

</head>

<body>

    <h3>
        <i class="fa-solid fa-utensils"></i>
        chilly Garden Restaurant
        <i class="fa-solid fa-bowl-food"></i>
    </h3>

    <p>Welcome To Our Restaurant </p>

    <table>

        <tr>
            <th>Menu Item</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Chicken Biryani</td>
            <td>₹250</td>
        </tr>

        <tr>
            <td>Masala Dosa</td>
            <td>₹120</td>
        </tr>

        <tr>
            <td>Paneer Butter Masala</td>
            <td>₹220</td>
        </tr>

    </table>

    <br>

    <p>
        <a href="#">View Full Menu</a>
    </p>

</body>

</html>
